<style>

.toast:empty{display:none}

<script>
var Cot = (function () {
"use strict";
var DEF = {
  gastos: { avalExt: 1125, avalInt: 0, buro: 150, ccit: 230 },
  cargoFijo: 663,
  descNoReciente: 0.08,
  descAntiguo: 0.05,
  bandas: [{ lim: 171000, desc: 0 }, { lim: 187000, desc: 0.1 }, { lim: 218000, desc: 0.2 }],
  cats: {
    A: { tasa: 0.03, pct: 0.7, techo: 400000 }, B: { tasa: 0.035, pct: 0.65, techo: 350000 },
    C: { tasa: 0.035, pct: 0.6, techo: 300000 }, D: { tasa: 0.035, pct: 0.55, techo: 200000 }, E: { tasa: 0.035, pct: 0.5, techo: 200000 }
  },
  comision: [{ desde: 0, pct: 0.04 }, { desde: 50000, pct: 0.035 }, { desde: 75000, pct: 0.035 }, { desde: 100000, pct: 0.03 },
    { desde: 150000, pct: 0.028 }, { desde: 200000, pct: 0.025 }, { desde: 300000, pct: 0.025 }],
  plazos: [{ n: "5 años", m: 60 }, { n: "4 años", m: 48 }, { n: "3 años", m: 36 }, { n: "2 años", m: 24 }, { n: "1 año", m: 12 }],
  tasas: [0.03, 0.035],
  textoFinal: ""
};
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function mergeDeep(base, over) {
  if (Array.isArray(base) || typeof base !== "object" || base === null) return over === undefined ? clone(base) : over;
  var out = {};
  Object.keys(base).forEach(function (k) { out[k] = mergeDeep(base[k], over ? over[k] : undefined); });
  return out;
}
function merge(d) { return mergeDeep(DEF, d || {}); }
function parseNum(v) {
  if (typeof v === "number") return v;
  var t = String(v == null ? "" : v).replace(/[^0-9.\-]/g, "");
  if (t === "" || t === "-" || t === ".") return NaN;
  return parseFloat(t);
}
function fmt(x, d) { return Number(x).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }); }
function money(x) { return "L. " + fmt(x, 2); }
function r2(x) { return Math.round((x + Number.EPSILON) * 100) / 100; }
function pmt(rate, n, pv) { return rate ? pv * rate / (1 - Math.pow(1 + rate, -n)) : pv / n; }
function tier(P, amount) {
  var pct = P.comision[0].pct;
  P.comision.forEach(function (t) { if (amount >= t.desde) pct = t.pct; });
  return pct;
}
function band(P, miles) {
  if (!isFinite(miles)) return 0;
  if (miles < P.bandas[0].lim) return 1;
  if (miles < P.bandas[1].lim) return 2;
  if (miles < P.bandas[2].lim) return 3;
  return 0;
}
function blank() {
  return { mode: 3, cliente: "", valor: "", recien: "SI", millas: "", descSobre: "PRECIO", cat: "A", monto: "", primaBy: "MONTO", primaPct: "", primaMonto: "",
    antiguo: "NO", tasa: "cat", tasaOtra: "", plazo: "TODOS", aval: "EXTERNO", buro: true, ccit: true, comision: true, phone: "", example: false };
}
function example() { var s = blank(); s.valor = "250000"; s.primaMonto = "80000"; s.example = true; return s; }

function calc(S, P) {
  var mode = Number(S.mode) || 3, cat = P.cats[S.cat] || P.cats.A;
  var n = function (v) { var x = parseNum(v); return isFinite(x) ? x : 0; };
  var valor = n(S.valor), millas = parseNum(S.millas), b = band(P, millas), prima = 0;
  if (mode === 3) prima = S.primaBy === "PORCENTAJE" ? r2(valor * n(S.primaPct) / 100) : r2(n(S.primaMonto));
  var valid = 0;
  if (mode === 1) valid = (valor > 0 && isFinite(millas) && S.recien && b > 0 && S.descSobre) ? 1 : 0;
  else if (mode === 2) valid = n(S.monto) > 0 ? 1 : 0;
  else valid = (valor > 0 && S.primaBy && prima >= 0 && prima < valor) ? 1 : 0;

  if (valid) {
    if (mode === 1) {
      descNR = S.recien === "NO" ? r2(valor * P.descNoReciente) : 0;
      base = valor - descNR;
      pctApl = Math.max(0, cat.pct - (S.antiguo === "SI" ? P.descAntiguo : 0));
      prestAntes = r2(base * pctApl);
      descPct = P.bandas[b - 1].desc;
      descMill = S.descSobre === "PRECIO" ? r2(base * descPct) : r2(prestAntes * descPct);
      loan = r2(prestAntes - descMill);

  }

  if (S.tasa === "otra") { var o = parseNum(S.tasaOtra); if (isFinite(o) && o > 0) tasa = o / 100; }

  });

  if (valid) {
    if (loan > cat.techo) st = "ATENCIÓN: el préstamo pasa el techo de la categoría (L. " + fmt(cat.techo, 0) + ")";
    else if (salida < 0) st = "ATENCIÓN: los gastos son mayores que el préstamo";
    else st = "OK";
  } else if (mode === 1) {
    if (valor <= 0) st = "FALTA: valor de venta del vehículo";
    else if (!S.recien) st = "FALTA: indique si es recién ingreso";
    else if (!isFinite(millas)) st = "FALTA: millas del vehículo";
    else if (b === 0) st = "NO CALIFICA: millas igual o mayor a " + fmt(P.bandas[2].lim, 0);
    else st = "FALTA: elija sobre qué se aplica el descuento de millaje";
  } else if (mode === 2) st = "FALTA: monto del préstamo";
  else if (valor <= 0) st = "FALTA: valor de venta del vehículo";
  else if (!S.primaBy) st = "FALTA: elija cómo calcular la prima";
  else st = "PRIMA NO VÁLIDA: debe ser 0 o más y menor que el valor del vehículo";
  return { mode: mode, valid: valid, valor: valor, millas: millas, band: b, cat: cat, pctApl: pctApl, prima: prima, base: base, descNR: descNR, prestAntes: prestAntes,
    descPct: descPct, descMill: descMill, loan: loan, tasa: tasa, aval: aval, buro: buro, ccit: ccit, comPct: comPct, comision: comision,
    gastos: gastos, salida: salida, cuotas: cuotas, status: st };
}

function message(S, P, R) {
  if (!R.valid) return null;
  var L = [], m = R.mode;
  L.push(m === 3 ? "*COTIZACIÓN - VENTA FINANCIADA*" : "*COTIZACIÓN DE PRÉSTAMO*");
  var cl = String(S.cliente || "").trim();
  if (cl) L.push("Cliente / Vehículo: " + cl);
  L.push("");
  if (m !== 2) L.push("Valor del vehículo: " + money(R.valor));
  if (m === 3) L.push("Prima: " + money(R.prima) + " (" + fmt(R.prima / R.valor * 100, 1) + "% del valor)");
  L.push((m === 3 ? "*Monto a financiar: " : "*Monto del préstamo: ") + money(R.loan) + "*");
  if (R.gastos > 0) {
    L.push(""); L.push("Gastos de cierre:");
    if (R.aval > 0) L.push("  - Avalúo: " + money(R.aval));
    if (R.buro > 0) L.push("  - Consulta de Buró: " + money(R.buro));
    if (R.ccit > 0) L.push("  - Inscripción CCIT: " + money(R.ccit));
    if (R.comision > 0) L.push("  - Comisión por desembolso (" + fmt(R.comPct * 100, 1) + "%): " + money(R.comision));
    L.push("Total gastos de cierre: " + money(R.gastos));
  }
  if (m === 3) { if (R.gastos > 0) L.push("*PAGO INICIAL (prima + gastos): " + money(R.salida) + "*"); }
  else { L.push(""); L.push("*VALOR A DESEMBOLSAR: " + money(R.salida) + "*"); }
  L.push(""); L.push("Tasa de interés mensual: " + fmt(R.tasa * 100, 2) + "%");
  L.push(""); L.push("*Cuota mensual:*");
  var found = P.plazos.some(function (p) { return p.n === S.plazo; });
  R.cuotas.forEach(function (c) {
    if (S.plazo === "TODOS" || !found || S.plazo === c.n) L.push(c.n + " (" + c.m + " meses): " + money(c.total));
  });
  if (String(P.textoFinal || "").trim()) { L.push(""); L.push(String(P.textoFinal).trim()); }
  return L;
}
return { DEF: DEF, clone: clone, merge: merge, parseNum: parseNum, fmt: fmt, money: money, calc: calc, message: message, blank: blank, example: example };
})();
</script>

  var h = "";
  if (S.example) h += '<div class="notice"><span>Estos son valores de ejemplo.</span><button class="btn small" data-act="reset">Empezar en blanco</button></div>';
  h += '<section class="panel"><h2>Cómo calcular</h2>' + seg("mode", [[3, "Venta financiada"], [1, "Por valor del vehículo"], [2, "Por monto del préstamo"]], m, "modes") + "</section>";
  h += '<section class="panel"><h2>Datos</h2>';
  h += '<label class="field"><span class="lbl">Cliente / vehículo (opcional)</span><input class="inp txt" type="text" autocomplete="off" data-in="cliente" value="' + esc(S.cliente) + '" placeholder="Ej. Juan Pérez, Toyota Corolla 2018"></label>';
  if (m !== 2) h += numIn("valor", "Valor de venta del vehículo (L.)", "250,000");
  if (m === 1) {
    h += grp("¿Recién ingreso al país?", seg("recien", [["SI", "Sí"], ["NO", "No"]], S.recien));
    h += grp("¿Vehículo antiguo o de agencia? (resta " + C.fmt(P.descAntiguo * 100, 0) + "% al préstamo)", seg("antiguo", [["SI", "Sí"], ["NO", "No"]], S.antiguo));
    h += numIn("millas", "Millas del vehículo", "90,000");
    h += grp("El descuento de millaje se aplica sobre", seg("descSobre", [["PRECIO", "Precio del vehículo"], ["PRESTAMO", "Monto del préstamo"]], S.descSobre));
  }
  if (m === 2) h += numIn("monto", "Monto del préstamo (L.)", "170,000");
  if (m === 3) {
    h += grp("Prima: calcular por", seg("primaBy", [["MONTO", "Monto"], ["PORCENTAJE", "Porcentaje"]], S.primaBy));
    h += S.primaBy === "PORCENTAJE" ? numIn("primaPct", "Prima (% del valor)", "25", "%") : numIn("primaMonto", "Prima (L.)", "80,000");
  }
  h += grp("Categoría", seg("cat", Object.keys(P.cats).map(function (k) { return [k, k]; }), S.cat, "cats") +
    '<p class="hint">Tasa ' + pct(cat.tasa) + (m === 1 ? " · Préstamo " + (S.antiguo === "SI" ? C.fmt(Math.max(0, cat.pct - P.descAntiguo) * 100, 0) + "% del valor (" + C.fmt(cat.pct * 100, 0) + "% menos " + C.fmt(P.descAntiguo * 100, 0) + "%)" : C.fmt(cat.pct * 100, 0) + "% del valor") : "") + " · Techo L. " + C.fmt(cat.techo, 0) + "</p>");
  var tasaOpts = [["cat", "Según categoría"]].concat(P.tasas.map(function (t) { return [String(t), pct(t)]; })).concat([["otra", "Otra"]]);
  var tasaCur = S.tasa;
  h += grp("Tasa mensual", seg("tasa", tasaOpts, tasaCur === "cat" || tasaCur === "otra" ? tasaCur : String(parseFloat(tasaCur))));
  if (S.tasa === "otra") h += numIn("tasaOtra", "Tasa mensual (%)", "3.25", "%");
  h += grp("Plazo a mostrar al cliente", seg("plazo", [["TODOS", "Todos"]].concat(P.plazos.map(function (p) { return [p.n, p.n]; })), S.plazo));
  h += "</section>";
  h += '<section class="panel"><h2>Gastos de cierre</h2>';
  h += grp("Avalúo (L. " + C.fmt(P.gastos.avalExt, 0) + " externo · L. " + C.fmt(P.gastos.avalInt, 0) + " interno)", seg("aval", [["EXTERNO", "Externo"], ["INTERNO", "Interno"], ["NO", "No"]], S.aval));
  h += grp("Consulta de Buró (L. " + C.fmt(P.gastos.buro, 0) + ")", seg("buro", [["1", "Sí"], ["0", "No"]], S.buro ? "1" : "0"));
  h += grp("Inscripción CCIT (L. " + C.fmt(P.gastos.ccit, 0) + ")", seg("ccit", [["1", "Sí"], ["0", "No"]], S.ccit ? "1" : "0"));
  h += grp("Comisión por desembolso (según el monto)", seg("comision", [["1", "Sí"], ["0", "No"]], S.comision ? "1" : "0"));
  h += "</section>";
  h += '<section class="panel"><h2>Enviar a (opcional)</h2><label class="field"><span class="lbl">WhatsApp del cliente</span><input class="inp" type="tel" inputmode="tel" autocomplete="off" data-in="phone" value="' + esc(S.phone) + '" placeholder="9999-9999"><span class="hint">Con 8 dígitos se agrega el +504. Vacío: eliges el contacto en WhatsApp.</span></label>';
  h += '<div><button class="btn small" data-act="reset">Nueva cotización</button></div></section>';
  return h;
}

function waHref(text) {
  var d = String(S.phone || "").replace(/\D/g, "");
  if (d.length === 8) d = "504" + d;
  return (d.length >= 8 ? "https://wa.me/" + d : "https://wa.me/") + "?text=" + encodeURIComponent(text);
}
function bubbleHtml(lines) { return esc(lines.join("\n")).replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>"); }

function resultHtml() {
  var R = C.calc(S, P), lines = C.message(S, P, R), h = "";
  var st = R.status, cls = st === "OK" ? "ok" : st.indexOf("ATENCIÓN") === 0 ? "warn" : st.indexOf("FALTA") === 0 ? "info" : "bad";
  h += '<div class="banner ' + cls + '">' + (st === "OK" ? "Listo para enviar" : esc(st)) + "</div>";
  if (R.valid) {
    var m = R.mode;
    h += '<section class="panel"><div class="sum"><div class="full"><small>' + (m === 3 ? "Monto a financiar" : "Monto del préstamo") + '</small><span class="big">' + C.money(R.loan) + "</span></div>" +
      "<div><small>" + (m === 3 ? "Pago inicial (prima + gastos)" : "Valor a desembolsar") + "</small><b>" + C.money(R.salida) + "</b></div>" +
      "<div><small>Tasa mensual</small><b>" + C.fmt(R.tasa * 100, 2) + "%</b></div></div>";
    h += '<div class="scroll"><table class="cu"><thead><tr><th>Plazo</th><th>Cuota préstamo</th><th>Cuota total</th></tr></thead><tbody>';
    var found = P.plazos.some(function (p) { return p.n === S.plazo; });
    R.cuotas.forEach(function (c) {
      if (S.plazo === "TODOS" || !found || S.plazo === c.n) h += "<tr><td>" + esc(c.n) + ' <span class="hint">(' + c.m + ')</span></td><td class="n">' + C.fmt(c.cuota, 2) + '</td><td class="n t">' + C.fmt(c.total, 2) + "</td></tr>";
    });
    h += '</tbody></table></div><p class="hint">La cuota total incluye el cargo fijo mensual de ' + C.money(P.cargoFijo) + ".</p>";
    h += "<details><summary>Detalle del cálculo</summary><div class=\"stack\" style=\"gap:6px;margin-top:10px\">";
    var kv = function (k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + "</span></div>"; };
    if (m === 1) {
      h += kv("Valor de venta", C.money(R.valor));
      if (R.descNR > 0) h += kv("(-) Descuento por no recién ingreso", C.money(R.descNR));
      h += kv("Valor base", C.money(R.base)) + kv("Banda de millas", R.band === 1 ? "Menos de " + C.fmt(P.bandas[0].lim, 0) : R.band === 2 ? C.fmt(P.bandas[0].lim, 0) + " a " + C.fmt(P.bandas[1].lim - 1, 0) : C.fmt(P.bandas[1].lim, 0) + " a " + C.fmt(P.bandas[2].lim - 1, 0));
      h += kv("% de préstamo de la categoría", C.fmt(R.cat.pct * 100, 0) + "%");
      if (S.antiguo === "SI") h += kv("(-) Antiguo o de agencia", C.fmt(P.descAntiguo * 100, 0) + "%") + kv("% de préstamo aplicado", C.fmt(R.pctApl * 100, 0) + "%");
      h += kv("Préstamo antes del descuento", C.money(R.prestAntes)) + kv("(-) Descuento por millaje (" + C.fmt(R.descPct * 100, 0) + "%)", C.money(R.descMill));
    } else if (m === 3) h += kv("Valor de venta", C.money(R.valor)) + kv("(-) Prima", C.money(R.prima));
    h += kv("Monto del préstamo", C.money(R.loan));
    if (R.gastos > 0) {
      if (R.aval > 0) h += kv("Avalúo", C.money(R.aval));
      if (R.buro > 0) h += kv("Consulta de Buró", C.money(R.buro));
      if (R.ccit > 0) h += kv("Inscripción CCIT", C.money(R.ccit));
      if (R.comision > 0) h += kv("Comisión (" + C.fmt(R.comPct * 100, 1) + "%)", C.money(R.comision));
      h += kv("Total gastos de cierre", C.money(R.gastos));
    }
    h += "</div></details></section>";
    h += '<section class="panel"><h2>Mensaje para WhatsApp</h2><div class="bubble" id="bubble">' + bubbleHtml(lines) + "</div></section>";
  } else h += '<section class="panel"><p class="hint">Completa los datos amarillos para ver la cotización y el mensaje.</p></section>';
  var ok = !!lines;
  h += '<div class="bar"><button class="btn" data-act="copy"' + (ok ? "" : " disabled") + '>Copiar</button>' +
    (ok ? '<a class="btn wa" href="' + esc(waHref(lines.join("\n"))) + '" target="_blank" rel="noopener">Enviar por WhatsApp</a>' : '<a class="btn wa" aria-disabled="true">Enviar por WhatsApp</a>') + "</div>";
  return h;
}

function get(o, path) { return path.split(".").reduce(function (a, k) { return a == null ? a : a[k]; }, o); }
function setp(o, path, v) { var p = path.split("."), last = p.pop(), t = p.reduce(function (a, k) { return a[k]; }, o); t[last] = v; }
function pin(path, label, kind, unit) {
  var v = get(Pd, path), show = kind === "pct" ? +(v * 100).toFixed(4) : v;
  var txt = kind === "txt";
  return '<label class="field"><span class="lbl">' + label + '</span><span class="unit"><input class="inp' + (txt ? " txt" : "") + '" type="text" ' + (txt ? "" : 'inputmode="decimal" ') + 'autocomplete="off" data-p="' + path + '" data-k="' + kind + '" value="' + esc(show) + '"' + (RO ? " disabled" : "") + ">" + (unit ? "<i>" + unit + "</i>" : "") + "</span></label>";
}
function paramsHtml() {
  var h = '<section class="panel"><h2>Gastos fijos</h2><div class="grid3">' +
    pin("gastos.avalExt", "Avalúo externo (L.)", "num") + pin("gastos.avalInt", "Avalúo interno (L.)", "num") + pin("gastos.buro", "Consulta de Buró (L.)", "num") + pin("gastos.ccit", "Inscripción CCIT (L.)", "num") +
    pin("cargoFijo", "Cargo fijo mensual en la cuota (L.)", "num") + pin("descNoReciente", "Descuento al precio si NO es recién ingreso", "pct", "%") + pin("descAntiguo", "Resta al % de préstamo si es antiguo o de agencia", "pct", "%") + "</div></section>";
  h += '<section class="panel"><h2>Millas y descuento por millaje</h2><p class="hint">Con millas iguales o mayores al límite de la banda 3 el vehículo no califica.</p>';
  Pd.bandas.forEach(function (b, i) { h += '<div class="prow two">' + pin("bandas." + i + ".lim", "Banda " + (i + 1) + ": menos de (millas)", "num") + pin("bandas." + i + ".desc", "Descuento", "pct", "%") + "</div>"; });
  h += "</section>";
  h += '<section class="panel"><h2>Categorías</h2>';
  Object.keys(Pd.cats).forEach(function (k) { h += '<div class="prow"><span class="tag">' + k + "</span>" + pin("cats." + k + ".tasa", "Tasa mensual", "pct", "%") + pin("cats." + k + ".pct", "% de préstamo", "pct", "%") + pin("cats." + k + ".techo", "Techo (L.)", "num") + "</div>"; });
  h += "</section>";
  h += '<section class="panel"><h2>Comisión por desembolso</h2><p class="hint">Según el monto del préstamo. Los montos deben ir de menor a mayor.</p>';
  Pd.comision.forEach(function (t, i) { h += '<div class="prow two">' + pin("comision." + i + ".desde", "Desde (L.)", "num") + pin("comision." + i + ".pct", "Porcentaje", "pct", "%") + "</div>"; });
  h += "</section>";
  h += '<section class="panel"><h2>Plazos y tasas rápidas</h2>';
  Pd.plazos.forEach(function (p, i) { h += '<div class="prow plazo">' + pin("plazos." + i + ".n", "Nombre", "txt") + pin("plazos." + i + ".m", "Meses", "num") + "</div>"; });
  h += '<div class="prow two">' + pin("tasas.0", "Tasa rápida 1", "pct", "%") + pin("tasas.1", "Tasa rápida 2", "pct", "%") + "</div></section>";
  h += '<section class="panel"><h2>Texto final del mensaje</h2>' + pin("textoFinal", "Opcional. Ej.: Sujeto a aprobación de crédito", "txt") + "</section>";
  h += '<section class="panel"><div class="pbar"><button class="btn pri" data-act="savep"' + (RO ? " disabled" : "") + '>Guardar parámetros</button><button class="btn" data-act="defp"' + (RO ? " disabled" : "") + ">" + (resetAsk ? "Confirmar: volver a los valores originales" : "Volver a los valores originales") + '</button></div><p class="hint" id="pmsg" role="status">' + esc(pMsg) + "</p>" +
    (RO ? '<p class="hint">Tienes acceso de solo lectura: puedes ver los parámetros, pero no cambiarlos.</p>' : "") + "</section>";
  return h;
}

function renderForm() { $("#form").innerHTML = formHtml(); }
function renderResult() { $("#result").innerHTML = resultHtml(); }
function renderParams() { $("#pane-par").innerHTML = paramsHtml(); }
function renderAll() {
  document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false"); });
  $("#pane-cot").hidden = tab !== "cotizar"; $("#pane-par").hidden = tab !== "params";
  if (tab === "cotizar") { renderForm(); renderResult(); } else renderParams();
}
function refresh() { if (tab === "params") { var a = document.activeElement; if (!(a && $("#pane-par").contains(a) && a.tagName === "INPUT")) renderParams(); } else { if (!focusInForm()) renderForm(); renderResult(); } }

function doCopy() {
  var lines = C.message(S, P, C.calc(S, P));
  if (!lines) return;
  var text = lines.join("\n");
  var fail = function () {
    var b = $("#bubble");
    if (b) { var r = document.createRange(); r.selectNodeContents(b); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast("Mantén presionado el mensaje para copiarlo");
  };
  try { navigator.clipboard.writeText(text).then(function () { toast("Mensaje copiado"); }, fail); } catch (e) { fail(); }
}
function saveParams() {
  if (RO) return;
  P = C.clone(Pd);
  var done = function (m) { pDirty = false; pMsg = m; var el = $("#pmsg"); if (el) el.textContent = m; };
  if (!db) { done("Aplicado en esta vista. Aquí no se puede guardar."); return; }
  db.doc("params/main").set(P).then(function () { done("Guardado. Se usará en todos tus dispositivos."); }, function () { pMsg = "No se pudo guardar. Revisa tu conexión."; var el = $("#pmsg"); if (el) el.textContent = pMsg; });
}

document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-tab],[data-set],[data-act]");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; renderAll(); return; }
  if (t.dataset.set) {
    var k = t.dataset.set, v = t.dataset.v;
    if (k === "buro" || k === "ccit" || k === "comision") v = v === "1";
    else if (k === "mode") v = Number(v);
    S[k] = v; persist(); renderForm(); renderResult(); return;
  }
  var a = t.dataset.act;
  if (a === "copy") doCopy();
  else if (a === "reset") { S = C.blank(); persist(); renderForm(); renderResult(); window.scrollTo(0, 0); }
  else if (a === "savep") saveParams();
  else if (a === "defp") {
    if (RO) return;
    if (resetAsk) { Pd = C.clone(C.DEF); pDirty = true; resetAsk = false; pMsg = "Valores originales cargados. Toca Guardar parámetros para aplicarlos."; renderParams(); }
    else { resetAsk = true; renderParams(); setTimeout(function () { if (resetAsk) { resetAsk = false; if (tab === "params") renderParams(); } }, 5000); }
  }
});
document.addEventListener("input", function (e) {
  var el = e.target;
  if (el.dataset.in) { S[el.dataset.in] = el.value; persist(); renderResult(); }
  else if (el.dataset.p && !RO) {
    var path = el.dataset.p, kind = el.dataset.k, val;
    if (kind === "txt") val = el.value;
    else { var x = C.parseNum(el.value); if (isNaN(x)) return; val = kind === "pct" ? x / 100 : x; }
    setp(Pd, path, val); pDirty = true; pMsg = "Cambios sin guardar.";
    var m = $("#pmsg"); if (m) m.textContent = pMsg;
  }
});
document.addEventListener("focusout", function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.fmt === "int") { var x = C.parseNum(el.value); if (isFinite(x)) el.value = C.fmt(x, x % 1 ? 2 : 0); }
});

async function boot() {
  renderAll();
  try {
    var c = window.claude;
    if (c && c.use) {
      db = await c.use("db");
      var u = await c.use("user");
      if (u && u.can) RO = (await u.can("data.write")) === false;
    }
  } catch (e) { db = null; }
  if (db) {
    db.doc("params/main").onSnapshot(function (s) {
      if (s.metadata.hasPendingWrites || pDirty || !s.exists) return;
      P = C.merge(s.data()); Pd = C.clone(P); refresh();
    }, function () {});
  }
}
boot();
})();
</script>

</body></html>
